<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن | Artboard Studio</title>
  <style>
    *{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
    body{background:#0f172a;color:#f8fafc;margin:0;padding:20px}
    .box{max-width:850px;margin:0 auto}
    .card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:16px;border:1px solid #334155}
    h2,h3{margin-top:0;color:#38bdf8}
    label{display:block;margin:10px 0 5px;font-weight:bold;color:#cbd5e1}
    input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:15px}
    .btn{background:#0284c7;color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold;margin-top:12px}
    .btn-ok{background:#16a34a;width:100%}
    .btn-out{background:#dc2626}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .hide{display:none}
    .row{display:flex;gap:8px;align-items:center}
    .up{background:#475569;padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
  </style>
</head>
<body>
<div class="box">
  <div id="login-box" class="card" style="max-width:400px;margin:60px auto">
    <h2 style="text-align:center">تسجيل دخول الأدمن</h2>
    <label>البريد الإلكتروني</label>
    <input type="email" id="em" value="rafathamed9@gmail.com">
    <label>كلمة المرور</label>
    <input type="password" id="pw" placeholder="اكتب كلمة المرور">
    <button type="button" id="go" class="btn" style="width:100%">دخول للوحة التحكم</button>
    <p id="msg" style="color:#fbbf24;text-align:center;margin-top:10px"></p>
  </div>

  <div id="panel" class="hide">
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">لوحة تحكم الموقع</h2>
      <div>
        <a href="../index.html" target="_blank" style="color:#38bdf8;margin-left:15px">معاينة الموقع ↗</a>
        <button type="button" id="out" class="btn btn-out" style="margin:0">خروج</button>
      </div>
    </div>

    <div class="card">
      <h3>1. الخطوط والأحجام والألوان</h3>
      <div class="grid">
        <div><label>نوع الخط</label><select id="f-font"><option value="'Cairo',sans-serif">Cairo</option><option value="'Tajawal',sans-serif">Tajawal</option><option value="'IBM Plex Sans Arabic',sans-serif">IBM Plex Sans Arabic</option></select></div>
        <div><label>حجم الخط الأساسي (px)</label><input type="number" id="f-size" value="16"></div>
        <div><label>حجم العنوان الرئيسي (px)</label><input type="number" id="h-size" value="48"></div>
        <div><label>اللون الرئيسي</label><input type="color" id="p-col" value="#9877ff" style="height:42px"></div>
      </div>
    </div>

    <div class="card">
      <h3>2. النصوص والروابط</h3>
      <label>العنوان الرئيسي</label><input type="text" id="h-title" value="ARTBOARD STUDIO">
      <label>الوصف التعريفي</label><textarea id="h-desc" rows="4"></textarea>
      <div class="grid">
        <div><label>نص زر التحميل</label><input type="text" id="b-txt" value="تحميل الإضافة الآن"></div>
        <div><label>رقم الواتساب</label><input type="text" id="wa-num" value="201127502899"></div>
      </div>
    </div>

    <div class="card">
      <h3>3. الصور والمرفقات</h3>
      <label>رابط ملف الإضافة</label>
      <div class="row"><input type="url" id="dl-url"><label class="up">رفع 📎<input type="file" id="u-dl" hidden></label></div>
      <label>صورة 1</label>
      <div class="row"><input type="url" id="im-1"><label class="up">رفع 🖼<input type="file" id="u-1" accept="image/*" hidden></label></div>
      <label>صورة 2</label>
      <div class="row"><input type="url" id="im-2"><label class="up">رفع 🖼<input type="file" id="u-2" accept="image/*" hidden></label></div>
      <label>صورة 3</label>
      <div class="row"><input type="url" id="im-3"><label class="up">رفع 🖼<input type="file" id="u-3" accept="image/*" hidden></label></div>
      <p id="u-msg" style="color:#38bdf8"></p>
    </div>

    <button type="button" id="sv" class="btn btn-ok">💾 حفظ ونشر التعديلات</button>
    <p id="s-msg" style="text-align:center;font-weight:bold"></p>
  </div>
</div>

<script>
const p = ['ht','tp','s:','/','/'].join('');
const fb = p + ['ww','w.','gst','atic','.com/firebasejs/10.8.0/'].join('');
const upApi = p + ['tm','pfi','les.','org/api/v1/upload'].join('');
const msg = document.getElementById('msg');

function loadS(u){return new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)})}

(async()=>{
  try{
    msg.innerText='جاري الاتصال...';
    await loadS(fb+'firebase-app-compat.js');
    await loadS(fb+'firebase-auth-compat.js');
    await loadS(fb+'firebase-firestore-compat.js');
    firebase.initializeApp({
      apiKey:"AIzaSyBYZy3hL5Nolj7KyFd3g8zKKCE83xWeRxg",
      authDomain:["artboardstudio-117a6",".firebaseapp",".com"].join(''),
      projectId:"artboardstudio-117a6"
    });
    const auth=firebase.auth(), db=firebase.firestore();
    msg.innerText='';

    auth.onAuthStateChanged(async u=>{
      document.getElementById('login-box').classList.toggle('hide',!!u);
      document.getElementById('panel').classList.toggle('hide',!u);
      if(u){
        const s=await db.collection('site').doc('content').get();
        if(s.exists){
          const d=s.data();
          if(d.siteFont)document.getElementById('f-font').value=d.siteFont;
          if(d.baseFontSize)document.getElementById('f-size').value=d.baseFontSize;
          if(d.heroTitleSize)document.getElementById('h-size').value=d.heroTitleSize;
          if(d.primaryColor)document.getElementById('p-col').value=d.primaryColor;
          if(d.heroTitle)document.getElementById('h-title').value=d.heroTitle;
          if(d.heroDescHtml)document.getElementById('h-desc').value=d.heroDescHtml.replace(/<[^>]*>/g,'');
          if(d.downloadBtnText)document.getElementById('b-txt').value=d.downloadBtnText;
          if(d.whatsappNumber)document.getElementById('wa-num').value=d.whatsappNumber;
          if(d.downloadFileUrl)document.getElementById('dl-url').value=d.downloadFileUrl;
          if(d.galleryImg1)document.getElementById('im-1').value=d.galleryImg1;
          if(d.galleryImg2)document.getElementById('im-2').value=d.galleryImg2;
          if(d.galleryImg3)document.getElementById('im-3').value=d.galleryImg3;
        }
      }
    });

    document.getElementById('go').onclick=async()=>{
      msg.innerText='جاري الدخول...';
      try{
        await auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value);
        msg.innerText='';
      }catch(e){msg.innerText='خطأ: '+e.message}
    };
    document.getElementById('out').onclick=()=>auth.signOut();

    document.getElementById('sv').onclick=async()=>{
      const sm=document.getElementById('s-msg');sm.innerText='جاري الحفظ...';
      try{
        await db.collection('site').doc('content').set({
          siteFont:document.getElementById('f-font').value,
          baseFontSize:document.getElementById('f-size').value,
          heroTitleSize:document.getElementById('h-size').value,
          primaryColor:document.getElementById('p-col').value,
          heroTitle:document.getElementById('h-title').value,
          heroDescHtml:document.getElementById('h-desc').value,
          downloadBtnText:document.getElementById('b-txt').value,
          whatsappNumber:document.getElementById('wa-num').value,
          downloadFileUrl:document.getElementById('dl-url').value,
          galleryImg1:document.getElementById('im-1').value,
          galleryImg2:document.getElementById('im-2').value,
          galleryImg3:document.getElementById('im-3').value
        });
        sm.innerText='✅ تم الحفظ بنجاح!';
      }catch(e){sm.innerText='❌ خطأ: '+e.message}
    };

    [['u-dl','dl-url'],['u-1','im-1'],['u-2','im-2'],['u-3','im-3']].forEach(([f,t])=>{
      document.getElementById(f).onchange=async e=>{
        const file=e.target.files[0];if(!file)return;
        const um=document.getElementById('u-msg');um.innerText='جاري الرفع...';
        const fd=new FormData();fd.append('file',file);
        const r=await fetch(upApi,{method:'POST',body:fd});const j=await r.json();
        if(j.status==='success'){document.getElementById(t).value=j.data.url.replace('tmpfiles.org/','tmpfiles.org/dl/');um.innerText='✅ تم الرفع، اضغط حفظ!';}
      };
    });
  }catch(e){msg.innerText='فشل التحميل: '+e.message}
})();
</script>
</body>
</html>
